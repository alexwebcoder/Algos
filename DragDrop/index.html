<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop Game</title>
    <link rel="stylesheet" href="styes.css">
    <script src="index.js" type="module"></script>
</head>
<body>

<div class="container">
    <div class="column" id="left-column">
        <div class="draggable" data-match="fruit">Banana</div>
        <div class="draggable" data-match="beverage">Soda</div>
        <div class="draggable" data-match="animal">Horse</div>
        <div class="draggable" data-match="car">Porsche</div>
    </div>

    <div class="column" id="right-column">
        <div class="dropzone" data-match="beverage">Beverage</div>
        <div class="dropzone" data-match="animal">Animal</div>
        <div class="dropzone" data-match="fruit">Fruit</div>
        <div class="dropzone" data-match="car">Car</div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>

</body>
</html>
