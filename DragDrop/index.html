<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" type="module"></script>
</head>
<body>

<div class="game-container flex">
    <section class="nickname-container flex">
        <h1 class="column-title capitalized">Nicknames</h1>
        <div class="column nicknames" id="left-column">
            <div class="draggable rectangle" data-match="fruit" tabindex="0" role="button" aria-label="Draggable Banana">Banana</div>
            <div class="draggable rectangle" data-match="beverage" tabindex="0" role="button" aria-label="Draggable Soda">Soda</div>
            <div class="draggable rectangle" data-match="animal" tabindex="0" role="button" aria-label="Draggable Horse">Horse</div>
            <div class="draggable rectangle" data-match="car" tabindex="0" role="button" aria-label="Draggable Porsche">Porsche</div>
        </div>
    </section>

    <section class="round-complete" aria-live="polite">
        <h1>Round 1 completed</h1>
        <img src="trophy.png" alt="Trophy" class="trophy-icon">
    </section>

    <section class="player-container flex">
        <h1 class="column-title capitalized">Players</h1>
        <div class="column" id="right-column">
            <div class="dropzone rectangle" data-match="beverage" tabindex="0" role="button" aria-label="Drop here for Beverage">Beverage</div>
            <div class="dropzone rectangle" data-match="animal" tabindex="0" role="button" aria-label="Drop here for Animal">Animal</div>
            <div class="dropzone rectangle" data-match="fruit" tabindex="0" role="button" aria-label="Drop here for Fruit">Fruit</div>
            <div class="dropzone rectangle" data-match="car" tabindex="0" role="button" aria-label="Drop here for Car">Car</div>
        </div>
    </section>
</div>


</body>
</html>
